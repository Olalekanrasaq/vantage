{% extends "base.html" %}
{% block title %}Upload Report — Vantage{% endblock %}

{% block content %}

<div class="mb-5">
    <h1 class="text-xl font-bold text-brand-900">Upload Report</h1>
    <p class="text-gray-500 text-sm mt-0.5">Manually upload a PDF report if it didn't arrive via email</p>
</div>

<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
    <form method="POST" enctype="multipart/form-data" class="space-y-5">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Report Date</label>
            <input type="date" name="report_date" required
                   class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm bg-gray-50
                          focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent" />
            <p class="text-xs text-gray-400 mt-1">Select the date the report covers (not today's date)</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">PDF File</label>
            <div x-data="{ filename: '' }"
                 class="border-2 border-dashed border-gray-200 rounded-xl p-6 text-center
                        hover:border-brand-400 transition cursor-pointer"
                 @click="$refs.fileInput.click()">
                <input type="file" name="pdf_file" accept=".pdf" required x-ref="fileInput"
                       class="hidden"
                       @change="filename = $event.target.files[0]?.name || ''" />
                <svg class="w-10 h-10 text-gray-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
                <p x-show="!filename" class="text-sm text-gray-400">Tap to select PDF file</p>
                <p x-show="filename" x-cloak class="text-sm text-brand-700 font-medium" x-text="filename"></p>
            </div>
        </div>

        <button type="submit"
                class="w-full bg-brand-900 text-white rounded-xl py-3.5 text-sm font-semibold
                       hover:bg-brand-700 active:bg-brand-600 transition">
            Upload &amp; Process Report
        </button>
    </form>
</div>

{% endblock %}
