{% extends "base.html" %}
{% block title %}Staff Login — Vantage{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] -mt-2">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 w-full max-w-sm">

        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-brand-900 rounded-xl mb-3">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-brand-900">Staff Login</h2>
            <p class="text-sm text-gray-500 mt-1">Enter the credentials your manager gave you</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
                <input type="text" name="username" required autocomplete="username"
                       class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm
                              focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent
                              bg-gray-50" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                <div x-data="{ show: false }" class="relative">
                    <input :type="show ? 'text' : 'password'" name="password" required
                           autocomplete="current-password"
                           class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm pr-12
                                  focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent
                                  bg-gray-50" />
                    <button type="button" @click="show = !show"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1">
                        <svg x-show="!show" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                        <svg x-show="show" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-brand-900 text-white rounded-xl py-3.5 text-sm font-semibold
                           hover:bg-brand-700 active:bg-brand-600 transition mt-2">
                Sign in
            </button>
        </form>

        <div class="mt-5 text-center">
            <a href="{{ url_for('auth.landing') }}"
               class="text-xs text-gray-400 hover:text-gray-600 transition">
                ← Back to main login
            </a>
        </div>
    </div>
</div>
{% endblock %}
