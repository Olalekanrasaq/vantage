{% extends "base.html" %}
{% block title %}Reset Password | Vantage{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10 bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
    <h1 class="text-xl font-bold text-brand-900">Set a new password</h1>
    <p class="text-sm text-gray-500 mt-1 mb-5">Use at least 8 characters.</p>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">New password</label>
            <input type="password" name="password" required minlength="8" autofocus
                   class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm bg-gray-50
                          focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm new password</label>
            <input type="password" name="confirm_password" required minlength="8"
                   class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm bg-gray-50
                          focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
        </div>
        <button type="submit"
                class="w-full bg-brand-900 text-white rounded-xl py-3.5 text-sm font-semibold hover:bg-brand-700 transition">
            Update password
        </button>
    </form>
</div>
{% endblock %}
