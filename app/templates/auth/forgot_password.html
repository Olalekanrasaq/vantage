{% extends "base.html" %}
{% block title %}Forgot Password | Vantage{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10 bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
    <h1 class="text-xl font-bold text-brand-900">Forgot your password?</h1>
    <p class="text-sm text-gray-500 mt-1 mb-5">Enter your account email and we'll send you a reset link.</p>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input type="email" name="email" required autofocus
                   class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm bg-gray-50
                          focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
        </div>
        <button type="submit"
                class="w-full bg-brand-900 text-white rounded-xl py-3.5 text-sm font-semibold hover:bg-brand-700 transition">
            Send reset link
        </button>
    </form>

    <p class="text-center text-xs text-gray-500 mt-5">
        <a href="{{ url_for('auth.user_login') }}" class="text-brand-600 font-medium hover:underline">Back to login</a>
    </p>
</div>
{% endblock %}
