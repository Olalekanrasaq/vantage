{% extends "base.html" %}
{% block title %}Submit Activity Report — Vantage{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mt-8">
    
    <div class="mb-6">
        <h1 class="text-xl font-bold text-gray-800">
            {% if existing %}Edit Today's Report{% else %}Submit Daily Report{% endif %}
        </h1>
        <p class="text-sm text-gray-500 mt-1">Date: {{ today.strftime('%B %d, %Y') }}</p>
    </div>

    <form method="POST" action="{{ url_for('staff.submit_report') }}" class="space-y-5">

        <!-- Metrics Grid -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">New Leads</label>
                <input type="number" name="new_leads" min="0" required
                       value="{{ existing.new_leads if existing else '' }}"
                       class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Visits</label>
                <input type="number" name="visits" min="0" required
                       value="{{ existing.visits if existing else '' }}"
                       class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Calls Made</label>
                <input type="number" name="calls" min="0" required
                       value="{{ existing.calls if existing else '' }}"
                       class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Recoveries</label>
                <input type="number" name="recoveries" min="0" required
                       value="{{ existing.recoveries if existing else '' }}"
                       class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
        </div>

        <!-- Text Areas (Note: values go BETWEEN the tags, not in a value="" attribute) -->
        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Challenges Faced</label>
            <textarea name="challenges" rows="3" 
                      class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 placeholder-gray-400"
                      placeholder="Any pushback from merchants, terminal errors, etc.">{{ existing.challenges if existing else '' }}</textarea>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Plan for Tomorrow</label>
            <textarea name="tomorrow_plan" rows="3"
                      class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 placeholder-gray-400"
                      placeholder="Areas to visit, specific merchants to follow up with...">{{ existing.tomorrow_plan if existing else '' }}</textarea>
        </div>

        <!-- Submit Button changes text contextually -->
        <div class="pt-2">
            <button type="submit" class="w-full bg-brand-900 text-white rounded-lg px-4 py-2.5 text-sm font-semibold hover:bg-brand-700 transition shadow-sm">
                {% if existing %}
                    Update Report
                {% else %}
                    Submit Report
                {% endif %}
            </button>
        </div>
        
    </form>
</div>
{% endblock %}
