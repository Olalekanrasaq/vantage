<!-- Weekly Not Met Table -->
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm mb-4">
  <details class="group">
    <summary class="px-4 py-3 border-b border-gray-50 flex items-center justify-between cursor-pointer list-none">
      <h2 class="text-sm font-semibold text-gray-700">
        Not Meeting Weekly Target
        <span class="ml-1 text-xs font-normal text-gray-400">({{ weekly_not_met.total }})</span>
      </h2>
      <svg class="w-5 h-5 text-gray-500 transition-transform duration-200 group-open:rotate-180" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </summary>
    {% include "partials/weekly_table.html" %}
  </details>
</div>
